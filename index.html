<!DOCTYPE html>
<html>

<head>
    <title>Docker Practice App</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Docker Practice App</h1>

    <p>Enter your name</p>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
        >

        <br>

        <button type="submit">
            Submit
        </button>

    </form>

    {% if message %}
        <div class="message">
            <strong>{{ message }}</strong>
        </div>
    {% endif %}

    <hr>

    <p>
        <a href="/health">Health Check</a>
    </p>

    <p>
        <a href="/api">API</a>
    </p>

</div>

</body>

</html>
